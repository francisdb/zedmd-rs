[package]
name = "zedmd"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "A Rust library for interfacing with the ZedMD display controller."
repository = "https://github.com/francisdb/zedmd-rs"

[lib]
name = "zedmd"
path = "src/lib.rs"

[[example]]
name = "pixel_scan"
path = "examples/pixel_scan.rs"

[[example]]
name = "settings"
path = "examples/settings.rs"

[[example]]
name = "display_test"
path = "examples/display_test.rs"

[[example]]
name = "plasma"
path = "examples/plasma.rs"

[[example]]
name = "plasma_rgb888"
path = "examples/plasma_rgb888.rs"

[[example]]
name = "rings"
path = "examples/rings.rs"

[[example]]
name = "rainbow"
path = "examples/rainbow.rs"

[[example]]
name = "scaling"
path = "examples/scaling.rs"

[features]
default = ["libudev"]
# On Linux, use libudev to enumerate serial ports. Without it serialport reads
# the USB ids from sysfs, which is enough to find a ZeDMD and leaves the binary
# without a libudev runtime dependency.
libudev = ["serialport/libudev"]

[dependencies]
log = "0.4.29"
miniz_oxide = "0.9.1"
serialport = { version = "4.9.0", default-features = false }

[dev-dependencies]
env_logger = "0.11.10"
